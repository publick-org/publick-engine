name: Engine tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # For the network's Worker (worker/), and the test that serves a published site through it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      # Pipeline parsing, page structure, links, and WCAG 2.2 AA checks, offline,
      # against saved Gloucester data (tests/fixtures/).
      - name: Test
        run: python -m pytest

      - name: Test Worker
        run: node --test worker/sites.test.js worker/scheduler.test.js
