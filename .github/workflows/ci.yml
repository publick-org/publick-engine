name: Engine tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # For the network's Worker (worker/), and the test that serves a published site through it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      # Undefined names, unused imports, and the like (ruff.toml): before the tests, which take longer.
      - name: Lint
        run: ruff check .

      # Pipeline parsing, page structure, links, and WCAG 2.2 AA checks, offline,
      # against saved Gloucester data (tests/fixtures/).
      - name: Test
        run: python -m pytest

      - name: Test Worker
        run: node --test worker/sites.test.js worker/scheduler.test.js
