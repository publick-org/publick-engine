name: Engine tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # For the network's Worker (worker/), and the test that serves a published site through it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      # Undefined names, unused imports, and the like (ruff.toml): before the tests, which take longer.
      - name: Lint
        run: ruff check .

      # Pipeline parsing, page structure, links, and WCAG 2.2 AA checks, offline,
      # against saved Gloucester data (tests/fixtures/). The browser checks take most of the
      # time, so the tests run on every core (pytest-xdist).
      - name: Test
        run: python -m pytest -n auto

      - name: Test Worker
        run: node --test worker/sites.test.js worker/scheduler.test.js
