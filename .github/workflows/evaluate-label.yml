# A pull request that changes how summaries are made, checked, or translated
# (the files the Evaluate workflow runs for) says whether its change was run
# against the model: this check fails until it carries one of two labels.
#
#   evaluate      the Evaluate workflow runs the sets against the model, now
#                 and on each push after; its own check shows how they went.
#                 Not on a pull request from a fork, where it can't run
#   no evaluate   the change can't alter what the model is asked or how its
#                 answers are checked (a comment, a rename, a log line)
#
# A pull request that changes none of those files passes without a label. The
# check reads the pull request's labels, file names and requirements.txt's
# diff, runs nothing against the model, and has no secrets. EVALUATED below
# names the same files as evaluate.yml's paths but requirements.txt
# (tests/test_workflows.py holds the two together): of the pinned
# requirements, only a change to the anthropic SDK's pin (SDK_PIN), which
# every request to the model goes through, is held for a label. Another
# dependency update passes without one, and can still be labeled `evaluate`.
name: Evaluation label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ask for a label when the evaluated files change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          EVALUATED: >-
            ^(pipeline/(summarize|factcheck|translate|glossary|evaluate|evaluate_translations|evaluate_agendas|digest_subject|evaluate_digest)\.py|evals/(minutes|translations|agendas|digest_subjects)\.json)$
          # A line of requirements.txt's diff that adds or removes the SDK's pin.
          SDK_PIN: >-
            ^[-+]anthropic(\[|[=<>!~;[:space:]]|$)
        run: |
          # On its own line: a diff that fails stops the step, where in a pipeline grep's result would hide it.
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          changed=$(grep -E "$EVALUATED" <<< "$files" || true)
          pins=$(git diff -U0 "$BASE_SHA...$HEAD_SHA" -- requirements.txt)
          # Without case, as pip reads a requirement's name.
          if grep -qiE "$SDK_PIN" <<< "$pins"; then
            changed="${changed:+$changed$'\n'}requirements.txt (the anthropic SDK's pin)"
          fi
          if [ -z "$changed" ]; then
            echo "No file the Evaluate workflow runs for is changed: no label needed."
            exit 0
          fi
          echo "Changed:"
          echo "$changed"
          case ",$LABELS," in
            *",evaluate,"*)
              if [ "$FROM_FORK" = true ]; then
                echo "::error::Labeled 'evaluate', but the sets can't run on a pull request from a fork: push its branch to this repository and open the pull request from there."
                exit 1
              fi
              echo "Labeled 'evaluate': the Evaluate workflow runs the sets, and its own check shows how they went." ;;
            *",no evaluate,"*) echo "Labeled 'no evaluate': not run against the model." ;;
            *)
              echo "::error::This pull request changes how summaries are made, checked, or translated. Label it 'evaluate' to run the sets against the model, or 'no evaluate' if the change can't alter their results."
              exit 1 ;;
          esac
