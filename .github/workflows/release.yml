# Releases, by themselves, once a day. Each morning, before the network's
# daily runs, the newest commit on main whose engine tests passed becomes the
# next release, with everything merged since the last one, and its major tag
# (v1) moves to it, so towns pinned to @v1 take it on their next run. The
# network moves its engine-version to it by a pull request of its own
# (publick.org's engine.yml). So the towns take at most one new engine a day,
# however many pull requests were merged.
#
# An urgent fix doesn't wait for the morning: Actions -> Release -> Run
# workflow releases now.
#
# The schedule below is a backup for a morning when nothing else started
# this workflow: GitHub can start it hours late, so it does nothing when a
# run started any other way (Run workflow, or the API) has succeeded since
# the last 08:00 UTC. Otherwise it would release a second time, with
# whatever was merged since the morning. Runs wait for one another, so two
# started together don't make the same release.
#
# The next version is a minor one (v1.4.0 -> v1.5.0) unless the pull requests
# merged since the last release are all labeled:
#   patch       v1.4.0 -> v1.4.1 (every one patch, or no release)
#   major       v1.4.0 -> v2.0.0 (any one), for a change that needs every
#               town's config edited; @v1 towns stay on v1 until they move
#   no release  left out
# A pull request that changes only files no town's run reads is left out
# too, without a label: Markdown (such as the README), the tests, the
# evaluation sets, the linter's settings, and what checks pull requests or
# releases (the ci, evaluate, evaluate-label, public-check and release
# workflows, dependabot.yml and public_check.py; UNRELEASED below). With
# nothing left, nothing is released.
#
# A release published by hand (Releases -> Draft a new release) still moves its
# major tag.
name: Release

on:
  schedule:
    # 08:20 UTC, before the network's first daily run (09:05) and its engine pull request (08:40). A backup:
    # see above. BACKUP_HOUR below is this hour.
    - cron: "20 8 * * *"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  release:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    # One at a time: a run started while another is going waits for it, then finds its release made.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # With its token saved in git's config: the major tag is pushed with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Release what's been merged since the last release
        env:
          GH_TOKEN: ${{ github.token }}
          # The hour (UTC) of the schedule above: a scheduled run does nothing when a run started any other
          # way has succeeded since that hour last came round (today's, or yesterday's for a run GitHub
          # starts after midnight).
          BACKUP_HOUR: "8"
          # Files no town's run reads. A pull request that changes only these is left out of the release.
          UNRELEASED: >-
            \.md$|^tests/|^evals/|^ruff\.toml$|^\.github/dependabot\.yml$|^\.github/public_check\.py$|^\.github/workflows/(ci|evaluate|evaluate-label|public-check|release)\.yml$
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            since="$(date -u -d "$BACKUP_HOUR hours ago" +%F)T$(printf '%02d' "$BACKUP_HOUR"):00:00Z"
            earlier=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch \
              --status success --limit 10 --json createdAt --jq "[.[] | select(.createdAt >= \"$since\")] | length")
            if [ "$earlier" -gt 0 ]; then
              echo "This workflow already ran since $since: the schedule is only a backup."
              exit 0
            fi
          fi
          # The newest commit on main whose engine tests passed.
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$sha" ]; then
            echo "No commit on main has passed the engine tests yet."
            exit 0
          fi
          latest=$(git tag --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if git merge-base --is-ancestor "$sha" "$latest"; then
            echo "$sha is already in $latest."
            exit 0
          fi
          # Each change since the last release: the pull request it merged, or the commit itself.
          bump=""
          for commit in $(git rev-list --first-parent "$latest..$sha"); do
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit/pulls" --jq '[.[] | select(.merged_at != null)][0] // empty')
            if [ -n "$pr" ]; then
              number=$(jq -r .number <<< "$pr")
              labels=$(jq -r '[.labels[].name] | join(",")' <<< "$pr")
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/files" --jq '.[].filename')
              what="#$number"
            else
              labels=""
              files=$(git diff-tree --no-commit-id --name-only -r "$commit")
              what="${commit:0:7}"
            fi
            if [[ ",$labels," == *",no release,"* ]]; then
              echo "$what: labeled 'no release'"
              continue
            fi
            if ! grep -qvE "$UNRELEASED" <<< "$files"; then
              echo "$what: only files no town's run reads"
              continue
            fi
            if [[ ",$labels," == *",major,"* ]]; then this=major
            elif [[ ",$labels," == *",patch,"* ]]; then this=patch
            else this=minor; fi
            echo "$what: $this"
            case "$bump,$this" in
              major,* | *,major) bump=major ;;
              minor,* | *,minor) bump=minor ;;
              *) bump=patch ;;
            esac
          done
          if [ -z "$bump" ]; then
            echo "Nothing to release since $latest."
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$bump" in
            major) version="v$((major + 1)).0.0" ;;
            minor) version="v$major.$((minor + 1)).0" ;;
            patch) version="v$major.$minor.$((patch + 1))" ;;
          esac
          gh release create "$version" --target "$sha" --title "$version" --generate-notes --notes-start-tag "$latest"
          # A release made with this workflow's token doesn't start other workflows, so the major tag moves here.
          git fetch --tags --force
          git tag -f "${version%%.*}" "$sha"
          git push -f origin "refs/tags/${version%%.*}"
          echo "Released $version (after $latest) and moved ${version%%.*} to it."

  # A release published by hand.
  major-tag:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      # With its token saved in git's config: the major tag is pushed with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Move the major tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(v[0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag $RELEASE_TAG is not vMAJOR.MINOR.PATCH; not moving a major tag."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          git tag -f "$major" "$RELEASE_TAG^{commit}"
          git push -f origin "refs/tags/$major"
          echo "Moved $major to $RELEASE_TAG."
